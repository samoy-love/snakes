# Прод-оверлей: TLS-конфиг nginx, порты 80/443, сертификаты хоста.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Требует:
#   * /etc/letsencrypt/live/snakes.samoy.love/{fullchain,privkey}.pem на хосте;
#   * WS_ORIGINS=https://snakes.samoy.love в .env;
#   * PROFILE_SECRET в .env.

services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx.common.conf:/etc/nginx/snippets/nginx.common.conf:ro
      - ./deploy/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./public:/var/www/snakes:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/certbot:/var/www/certbot

# Прод-оверлей: TLS-конфиг nginx, порты 80/443, сертификаты хоста.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Требует:
#   * /etc/letsencrypt/live/snakes.samoy.love/{fullchain,privkey}.pem на хосте;
#   * WS_ORIGINS=https://snakes.samoy.love в .env;
#   * PROFILE_SECRET в .env.

services:
  # Оба сервиса ограничивают json-file лог явно (10m x 3): без этого драйвер
  # пишет без предела и выедает диск, общий с чужими проектами. Дублируется
  # здесь, а не только в базовом файле, чтобы прод-оверлей был самодостаточен
  # при чтении и не «терял» лимит, если базовый файл когда-нибудь разъедется.
  game:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports: !override
      - "80:80"
      - "443:443"
    # GAME_PORT/NGINX_ENVSUBST_FILTER наследуются из базового docker-compose.yml:
    # прод-конфиг тоже шаблон и тоже подставляет только порт апстрима.
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx.common.conf:/etc/nginx/snippets/nginx.common.conf:ro
      - ./deploy/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./public:/var/www/snakes:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/certbot:/var/www/certbot

name: Deploy

# Механика выкатки — в deploy-kit. Здесь только что катим и какой регресс
# обязан пройти.
#
# Перезапуск сервиса прерывает идущие матчи: состояние комнат живёт в памяти.
# Поэтому автодеплой по каждому мержу не заведён — выкатка по тегу или руками.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Показать план, ничего не менять'
        type: boolean
        default: false

jobs:
  deploy:
    uses: tr0llex/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/prod.env
      # -race обязателен: комнаты, профили, лимитеры, ИИ ботов и экономика
      # работают в разных горутинах. Гонка здесь не роняет процесс громко,
      # а тихо портит балансы игроков.
      gates: go vet ./... && go test ./... -race -count=1
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

name: Deploy

# Механика выкатки — в deploy-kit. Здесь только что катим и какой регресс
# обязан пройти.
#
# Триггер общий для всех проектов samoy.love: мерж в main уезжает на прод.
#
# Раньше здесь стоял тег, и причина была настоящая: перезапуск сервиса рвёт
# идущие матчи — состояние комнат живёт в памяти. Но тег эту потерю не убирал,
# а лишь делал реже; взамен main переставал быть выкатываемым, и вопрос «что
# сейчас на проде» переставал совпадать с «что в main». Обрыв матчей лечится
# graceful-рестартом в самом сервисе, а не редкими выкатками.

on:
  push:
    branches: [main]
    paths-ignore:
      # Опасное направление здесь одно: спрятать от выкатки файл, который
      # влияет на прод, — тогда прод молча остаётся на старом коде, и об этом
      # никто не сообщит. Поэтому список сверен с тем, что BUILD_CMD реально
      # кладёт в артефакт: бинарь `go build .` и копия public/. Ни одного .md
      # в public/ нет, go:embed в репозитории нет ни одного — весь markdown
      # лежит в корне (README, CLAUDE) и в docs/ и до прода не доезжает.
      # Копировать эту строку в репозиторий, где текст страниц лежит в
      # markdown, нельзя: там шаблон спрячет от выкатки правку самого прода.
      - '**.md'
      # docs/ в артефакт не попадает, но один файл оттуда читает ГЕЙТ:
      # env_docs_test.go сверяет os.Getenv в коде с docs/config.md, и это
      # часть `go test ./...`. Из-под ignore он выведен сознательно: правка
      # одной документации не должна катить прод, а разъехаться незаметно она
      # не может — ci.yml гоняет тот же прогон на pull_request, на результате
      # слияния, и в main такой коммит не попадёт красным.
      - 'docs/**'
      # Настройки редактора не входят в гейт (`go vet` и `go test`) и в
      # артефакт не попадают.
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Показать план, ничего не менять'
        type: boolean
        default: false

# Минимальные права для GITHUB_TOKEN. Выкатка ходит на сервер по SSH
# секретами, токен ей нужен только для checkout.
#
# deployments: write — чтобы связь «коммит → выкатка» была видна из GitHub, а
# не только по логам. Запись Deployment ставится на тот же SHA, что уехал на
# прод, и показывается на самом коммите и в панели Environments; версия релиза
# (release-<дата>-<sha>) и поле commit в version.json указывают в ту же точку.
# Переиспользуемый workflow не может иметь прав больше, чем дал вызывающий,
# поэтому право обязано стоять с ОБЕИХ сторон. Половинки въезжают независимо:
# пока в deploy-kit шага ещё нет, лишнее право ничего не делает, а когда шаг
# появится раньше этой строки — он обязан пережить 403 и не уронить выкатку.
# Пропавшая запись — косметика, упавшая выкатка — нет.
permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: tr0llex/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/prod.env
      # -race обязателен: комнаты, профили, лимитеры, ИИ ботов и экономика
      # работают в разных горутинах. Гонка здесь не роняет процесс громко,
      # а тихо портит балансы игроков.
      #
      # Разбит на два прогона, как в ci.yml (см. его job `go`): -short снимает
      # с прогона под детектором длинные однопоточные бюджеты и сценарии
      # ботов — в них нет ни горутин, ни каналов, детектору там нечего
      # искать, зато он замедляет код в 5-20 раз. Полный набор без детектора
      # (там гонки бессмысленны — время меряется, а не потоки) занимает
      # секунды. Раньше единый `go test ./... -race -count=1` без -short
      # держал этот gate ~8 минут почти целиком сам; здесь то же покрытие
      # (каждый тест гоняется хотя бы раз), но без замедления детектором там,
      # где он ничего не проверяет.
      gates: go vet ./... && go test ./... -race -short -count=1 && go test ./... -count=1
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

name: CI

on:
  # ТОЛЬКО pull_request. Раньше здесь был ещё push во все ветки, кроме main, и
  # каждый джоб выполнялся ДВАЖДЫ: один раз на пуш ветки, второй — на тот же
  # коммит в PR. Это не удвоенная надёжность, а удвоенное время и деньги: в
  # metro-map сквозные тесты идут минутами, и половина этих минут уходила в
  # прогон, результат которого никто не читает.
  #
  # Гейт — мерж, а мерж идёт через PR, поэтому проверять нужно ровно то, что
  # мержится: pull_request считает проверки на результате слияния с main, а не
  # на голой ветке. Ветка без PR остаётся непроверенной сознательно — её и не
  # во что мержить.
  pull_request:
  # Для ветки без PR: запустить руками, если понадобилось.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в опубликованную историю, и убирать его пришлось переписыванием. Локальный
  # хук (.githooks/commit-msg) ловит это раньше, но он включается вручную и в
  # клоне отсутствует — здесь страховка.
  commits:
    name: Коммиты без упоминаний ИИ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          # Событие всегда pull_request (см. блок on:), поэтому диапазон один:
          # то, что ветка добавляет к своей базе.
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  go:
    name: Go (vet / build / test -race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod, а не пишется здесь второй раз: '1.25'
          # означало «любой 1.25.x, какой окажется у раннера», и прогон мог
          # идти на toolchain со stdlib-уязвимостями, о которых go.mod уже
          # знает. Одно место с версией — go.mod, где стоит точный 1.25.12.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::Найдены неотформатированные файлы, запустите gofmt -w ."
            echo "$out"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # go vet ловит только грубые ошибки. staticcheck добавляет проверки,
      # которые в этом проекте уже были бы полезны: неиспользуемый код,
      # бессмысленные сравнения, неверная работа с временем и строками.
      # Отдельным шагом, а не через golangci-lint: одна зависимость вместо
      # десятка, и версия фиксирована — линтер не должен краснеть сам по себе
      # после чужого релиза.
      - name: staticcheck
        # Приколот к SHA, а не к тегу: тег v1 мутабелен, и сторонний action
        # выполняется в том же job'е, что и сборка.
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2025.1.1"
          install-go: false

      - name: go build
        run: go build ./...

      # -short снимает с прогона под детектором длинные однопоточные тесты:
      # бюджеты производительности и сценарные симуляции ботов. В них нет ни
      # горутин, ни каналов — детектору там нечего искать, зато он замедляет
      # код в 5-20 раз, и пакет переставал укладываться в таймаут. Вся
      # конкурентная логика (комнаты, хаб, WebSocket) проверяется здесь.
      - name: go test -race
        run: go test ./... -race -short

      # Те же тесты, но без детектора: бюджеты меряют время (под -race это
      # бессмысленно), сценарии гоняют десятки тысяч тиков. Полный прогон
      # пакетов занимает около 15 секунд.
      - name: Длинные тесты и бюджеты (без -race)
        # Покрытие снимается ИМЕННО ЗДЕСЬ, а не с прогона под -race: там стоит
        # -short, и сценарные симуляции с бюджетами в профиль не попадали.
        # Покрытие получалось занижённым ровно на те тесты, которые дольше
        # всех идут — то есть на самые содержательные.
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic

      # Покрытие уезжает в Codecov: цифра в README должна обновляться сама,
      # иначе она превращается в украшение и врёт при первом же изменении.
      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  js:
    name: JS syntax + client protocol tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 22.x: `node --check` сам определяет ES-модуль по синтаксису.
          # На 20.x файлы с `export` (client_net.js и др.) падали бы как CJS.
          node-version: '24'

      - name: node --check public/*.js
        run: |
          status=0
          for f in public/client.js public/client_*.js; do
            [ -e "$f" ] || continue
            echo "check $f"
            node --check "$f" || status=1
          done
          exit $status

      # `node --check` проверяет только синтаксис. Клиент при этом разбирает
      # бинарный протокол по точным смещениям байтов, и рассинхрон кодера с
      # декодером трижды за проект ломал игру МОЛЧА: пропадали киллфид, тосты,
      # обновления заданий, баланс валюты показывал мусор.
      #
      # Эти тесты закрывают ровно это:
      #   * эталонные буферы на все 21 типов событий, ROI и чанки миникарты
      #     (сняты с боевых Go-сериализаторов, лежат в репозитории как данные —
      #     Go для запуска не нужен) прогоняются через независимый декодер;
      #   * фактический public/client.js статически сверяется с эталоном:
      #     наличие обработчика на каждый тип, need(...), последовательность
      #     ширин чтений и сумма o += N.
      #
      # Зависимостей нет: только node:test и node:assert.
      # Обратную сторону (эталон не отстал от сериализаторов) проверяет
      # TestProtocolGoldenExport в задаче go.
      - name: Client protocol tests (node --test)
        run: node --test tests/protocol_golden.test.mjs tests/client_contract.test.mjs

  visual:
    name: Визуальные тесты экранов (Playwright)
    runs-on: ubuntu-latest
    # Тест игровой сессии сам доводит матч до конца (MATCH_DURATION_TICKS в
    # make run-visual) — прогон честно занимает несколько минут на все три
    # вьюпорта, это не зависший джоб. Локально (без установки браузера)
    # три вьюпорта укладываются в ~5 минут — запас на холодный кэш CI.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/visual/package-lock.json

      - name: npm ci
        working-directory: tests/visual
        run: npm ci --no-audit --no-fund

      # Кэш браузеров Playwright по хэшу package-lock.json: без него каждый
      # прогон заново тянет ~150 МБ Chromium, хотя версия годами не меняется
      # между соседними коммитами.
      - name: Кэш браузеров Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/visual/package-lock.json') }}

      - name: Установить браузеры Playwright
        working-directory: tests/visual
        # --with-deps только при промахе кэша: сами бинарники браузеров кэш
        # уже восстановил, но системные .so-зависимости (libnss3 и т.п.)
        # кэш не покрывает и ставятся отдельно на раннере каждый раз.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: make test-visual
        run: make test-visual

      - name: Скриншоты упавших тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-failures
          path: tests/visual/test-results
          retention-days: 7

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet / build / test -race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::Найдены неотформатированные файлы, запустите gofmt -w ."
            echo "$out"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # go vet ловит только грубые ошибки. staticcheck добавляет проверки,
      # которые в этом проекте уже были бы полезны: неиспользуемый код,
      # бессмысленные сравнения, неверная работа с временем и строками.
      # Отдельным шагом, а не через golangci-lint: одна зависимость вместо
      # десятка, и версия фиксирована — линтер не должен краснеть сам по себе
      # после чужого релиза.
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2025.1.1"
          install-go: false

      - name: go build
        run: go build ./...

      # -short снимает с прогона под детектором длинные однопоточные тесты:
      # бюджеты производительности и сценарные симуляции ботов. В них нет ни
      # горутин, ни каналов — детектору там нечего искать, зато он замедляет
      # код в 5-20 раз, и пакет переставал укладываться в таймаут. Вся
      # конкурентная логика (комнаты, хаб, WebSocket) проверяется здесь.
      - name: go test -race
        run: go test ./... -race -short -coverprofile=coverage.out -covermode=atomic

      # Те же тесты, но без детектора: бюджеты меряют время (под -race это
      # бессмысленно), сценарии гоняют десятки тысяч тиков. Полный прогон
      # пакетов занимает около 15 секунд.
      - name: Длинные тесты и бюджеты (без -race)
        run: go test ./... -count=1

      # Покрытие уезжает в Codecov: цифра в README должна обновляться сама,
      # иначе она превращается в украшение и врёт при первом же изменении.
      - name: Отправить покрытие в Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  js:
    name: JS syntax + client protocol tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 22.x: `node --check` сам определяет ES-модуль по синтаксису.
          # На 20.x файлы с `export` (client_net.js и др.) падали бы как CJS.
          node-version: '24'

      - name: node --check public/*.js
        run: |
          status=0
          for f in public/client.js public/client_*.js; do
            [ -e "$f" ] || continue
            echo "check $f"
            node --check "$f" || status=1
          done
          exit $status

      # `node --check` проверяет только синтаксис. Клиент при этом разбирает
      # бинарный протокол по точным смещениям байтов, и рассинхрон кодера с
      # декодером трижды за проект ломал игру МОЛЧА: пропадали киллфид, тосты,
      # обновления заданий, баланс валюты показывал мусор.
      #
      # Эти тесты закрывают ровно это:
      #   * эталонные буферы на все 21 типов событий, ROI и чанки миникарты
      #     (сняты с боевых Go-сериализаторов, лежат в репозитории как данные —
      #     Go для запуска не нужен) прогоняются через независимый декодер;
      #   * фактический public/client.js статически сверяется с эталоном:
      #     наличие обработчика на каждый тип, need(...), последовательность
      #     ширин чтений и сумма o += N.
      #
      # Зависимостей нет: только node:test и node:assert.
      # Обратную сторону (эталон не отстал от сериализаторов) проверяет
      # TestProtocolGoldenExport в задаче go.
      - name: Client protocol tests (node --test)
        run: node --test tests/protocol_golden.test.mjs tests/client_contract.test.mjs


name: Обновить эталоны визуальных тестов

# Ручной запуск: эталоны Playwright платформозависимы (шрифты, сглаживание),
# и точно повторить окружение раннера ubuntu-latest локально (даже в Docker
# с тем же образом Playwright) не получилось — системные шрифты у раннера
# GitHub свои. Единственный надёжный способ снять эталон "как для CI" — снять
# его СРЕДСТВАМИ CI. См. docs/testing.md, раздел «Эталоны платформозависимы».
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-visual-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: make test-visual-update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/visual/package-lock.json

      - name: npm ci
        working-directory: tests/visual
        run: npm ci --no-audit --no-fund

      - name: Кэш браузеров Playwright
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/visual/package-lock.json') }}

      - name: Установить браузеры Playwright
        working-directory: tests/visual
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: make test-visual-update
        run: make test-visual-update

      # Эталоны — не результат прогона, а СЛЕДУЮЩИЙ коммит: заливать их прямо
      # отсюда в ветку означало бы автокоммит от бота, а diff обязателен к
      # просмотру глазами (см. Makefile) — иначе сюда же въедет регрессия.
      - name: Забрать эталоны артефактом
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-snapshots-linux
          path: tests/visual/screens.spec.mjs-snapshots
          retention-days: 14

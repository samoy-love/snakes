name: Покрытие main

# ЗАЧЕМ ОТДЕЛЬНЫЙ ВОРКФЛОУ, А НЕ ШАГ В ci.yml.
#
# Codecov привязывает отчёт к КОММИТУ, а бейдж и «project»-статус считает по
# ветке по умолчанию. Отчёты из ci.yml приходят на коммиты веток PR — для main
# они не приезжают никогда, потому что ci.yml намеренно ходит только по
# pull_request (см. комментарий к его триггеру).
#
# Пока этого файла не было, данные main стояли на месте: бейдж в README
# показывал цифру того дня, когда CI последний раз запускался на push в main.
# Бейдж покрытия, который не обновляется, — ровно то «украшение, которое
# врёт», от которого его и заводили.
#
# Возвращать `push: branches: [main]` в ci.yml было бы дороже: там ещё линтеры,
# сборка и сквозные тесты — всё это уже отработало на PR и на том же дереве.
# Здесь только то, что даёт цифру, и команды те же самые: иначе сравнение
# «PR против main» перестаёт что-либо значить.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Мержи иногда идут подряд; предыдущий счёт не нужен, важен последний main.
concurrency:
  group: coverage-main
  cancel-in-progress: true

jobs:
  coverage:
    name: Покрытие main в Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Тот же прогон, что и на PR: без -short и без -race. Покрытие снимается
      # именно с полного прогона — под -short длинные сценарии в профиль не
      # попадают, и цифра занижается на девятнадцать пунктов.
      - name: Тесты с покрытием
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Отправить покрытие в Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

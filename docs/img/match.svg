<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Место для скриншота матча">
  <!--
    ПЛЕЙСХОЛДЕР. Заменить на настоящий кадр матча.

    Снять готовым стендом, он рисует реальный клиент против живого сервера:
        cd tools && npm i && npm run shots:desktop
    Кадры лягут в tools/shots/ — взять desktop-30-midgame.png (там видны
    чужие территории, след, плашки ников и эффект захвата), сжать в webp
    и положить сюда как match.webp, поправив ссылку в README.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.55" stop-color="#0d1218"/>
      <stop offset="1" stop-color="#090b12"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#182029" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Условные территории: показывают композицию кадра, не претендуя на реализм -->
  <rect x="90" y="90" width="270" height="180" rx="4" fill="#2ec4a6" opacity="0.20"/>
  <rect x="780" y="120" width="330" height="240" rx="4" fill="#7c5cff" opacity="0.18"/>
  <rect x="420" y="380" width="300" height="200" rx="4" fill="#e0457b" opacity="0.18"/>

  <!-- След и голова -->
  <g fill="#c8e34a" opacity="0.85">
    <rect x="500" y="330" width="26" height="26" rx="3"/>
    <rect x="530" y="330" width="26" height="26" rx="3"/>
    <rect x="560" y="330" width="26" height="26" rx="3"/>
    <rect x="590" y="330" width="26" height="26" rx="3"/>
  </g>
  <circle cx="633" cy="343" r="15" fill="#dff56b"/>

  <text x="600" y="612" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="19" fill="#5b6675" letter-spacing="0.14em">СКРИНШОТ МАТЧА · ПЛЕЙСХОЛДЕР</text>
  <text x="600" y="641" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace"
        font-size="14" fill="#3f4854">tools: npm run shots:desktop</text>
</svg>

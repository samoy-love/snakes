# Конфигурация staticcheck.
#
# checks — список по умолчанию плюс одно осознанное исключение.
#
# ST1018 («строковый литерал содержит Unicode control-символ, замените на
# escape») отключён точечно из-за sanitize_test.go. Этот тест проверяет, что
# sanitizeLogField вырезает ВСЕ управляющие символы, и для этого держит их в
# литералах живьём — байт U+007F (DEL) и U+0085 (NEL). Замена на \x7f/
# формально удовлетворит линтер, но тест перестанет быть очевидным: смысл
# именно в том, что в исходнике лежит настоящий control-байт, а не его запись.
# Проверка стилистическая, на корректность не влияет.
#
# Все остальные проверки, включая весь класс SA (реальные ошибки), остаются
# включёнными. Именно SA6002 поймал аллокации на sync.Pool.Put в горячем пути.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1018", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]

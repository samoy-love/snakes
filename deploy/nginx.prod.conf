# ---------------------------------------------------------------------------
# nginx для ПРОДА (snakes.samoy.love), TLS + редирект с 80.
# Подключается через docker-compose.prod.yml:
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Требует смонтированного /etc/letsencrypt с живыми сертификатами — без них
# nginx не стартует. Локально используйте deploy/nginx.conf (HTTP).
# ---------------------------------------------------------------------------

upstream snakes_game {
    server game:${GAME_PORT};
    keepalive 16;
}

# --------------------------- Лимиты: зоны (http) ---------------------------
# Зоны обязаны жить в контексте http. Имена с префиксом snakes_, чтобы не
# столкнуться с чужими зонами. Сами limit_conn/limit_req — в nginx.common.conf.
limit_conn_zone $binary_remote_addr zone=snakes_ws_conn:10m;
limit_req_zone  $binary_remote_addr zone=snakes_ws_req:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=snakes_http_conn:10m;
limit_req_zone  $binary_remote_addr zone=snakes_http_req:10m rate=20r/s;

map $scheme $hsts_value {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# ------------------------------ HTTP: редирект -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME-челленджи letsencrypt должны отдаваться по HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------ HTTPS: игра --------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name snakes.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/snakes.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snakes.samoy.love/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/snakes_access.log;
    error_log  /var/log/nginx/snakes_error.log;

    limit_conn_status 429;
    limit_req_status  429;
    limit_req_log_level warn;

    root /var/www/snakes;
    index index.html;

    include /etc/nginx/snippets/nginx.common.conf;
}

# ------------------- Внутренний слушатель метрик (не публикуется) ----------
# Доступен только по имени nginx:8081 изнутри docker-сети snakes_net.
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /metrics {
        proxy_pass http://snakes_game;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}

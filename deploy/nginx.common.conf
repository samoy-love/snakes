# ---------------------------------------------------------------------------
# Общая начинка server-блока: маршруты игры. Подключается и из локального
# HTTP-стенда (nginx.conf), и из прод-блока с TLS (nginx.prod.conf), чтобы
# правила проксирования не расползались в двух копиях.
#
# Ожидает, что в объемлющем server-блоке заданы root и index.
# ---------------------------------------------------------------------------

client_max_body_size 2m;

include /etc/nginx/snippets/security-headers.conf;

# ---------------------------------- WebSocket ------------------------------
location = /ws {
    proxy_pass http://snakes_game;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    # ВАЖНО: именно $http_host, а не $host. $host отбрасывает порт, а библиотека
    # nhooyr.io/websocket на стороне сервера сверяет Origin с заголовком Host и
    # при несовпадении отдаёт 403 ("Origin localhost:8080 is not authorized for
    # Host localhost"). С $host любой нестандартный порт ломал WebSocket.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Игра может молчать в сторону клиента дольше минуты (пауза между матчами),
    # поэтому таймауты сильно больше дефолтных 60s, иначе nginx рвёт сокет.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# --------------------------- health / readiness ----------------------------
# Нужны оркестратору и docker healthcheck; наружу отдаём как есть.
location = /healthz {
    access_log off;
    proxy_pass http://snakes_game;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}

location = /readyz {
    access_log off;
    proxy_pass http://snakes_game;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}

# --------------------- /metrics: наружу закрыт полностью -------------------
# Раньше здесь стоял geo-фильтр по $remote_addr на docker-подсети. За NAT
# docker'а хостовые запросы приходят с адреса шлюза 172.18.0.1, то есть фильтр
# пропускал ВСЕХ, кто стучится в опубликованный порт. Теперь публичный
# server-блок отдаёт 404 безусловно, а метрики живут на отдельном слушателе
# 8081, который compose наружу не публикует (см. nginx.conf, server metrics).
location = /metrics {
    access_log off;
    return 404;
}

# ---------------------------------- Статика --------------------------------
location = /favicon.ico {
    access_log off;
    return 204;
}

# Эмодзи-спрайты неизменяемы: агрессивный кэш.
location ^~ /emoji-64/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# html/js/css обновляются вместе с релизом — кэш запрещён.
location = / {
    try_files /index.html =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma  "no-cache" always;
    add_header Expires "0" always;
}

location ~* \.(?:html|css|js|mjs)$ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma  "no-cache" always;
    add_header Expires "0" always;
}

# Всё остальное: сначала файл на диске, иначе — в Go-сервер.
location / {
    try_files $uri $uri/ @game;
}

location @game {
    proxy_pass http://snakes_game;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
}

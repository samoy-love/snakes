# Доступ Prometheus к /metrics.
#
# Базовый юнит закрывает сеть на уровне ядра: IPAddressAllow=localhost и
# IPAddressDeny=any, то есть снаружи хоста до процесса не достучаться вообще.
# Это остаётся в силе — снимать ограничение целиком нельзя, весь его смысл в
# том, что игровой процесс виден только nginx'у на этой же машине.
#
# Prometheus живёт в docker-стеке samoylove-metrics и приходит с адреса своей
# compose-сети (172.18.0.0/16), а не с 127.0.0.1, поэтому ядро роняло его
# подключение в таймаут. Ниже открываются ровно две подсети docker-мостов:
#   172.17.0.0/16 — docker0, он же адрес host.docker.internal;
#   172.18.0.0/16 — сеть samoylove-metrics_default, с неё приходит сам сборщик.
# Обе — локальные мосты этого хоста, наружу они не маршрутизируются.
#
# IPAddressAllow дополняет список базового юнита, а не заменяет его: localhost
# из [Service] основного файла остаётся разрешённым.
#
# Подсети сверены с сервером 03.08.2026, обе совпали:
#   docker network inspect samoylove-metrics_default -> 172.18.0.0/16
#   docker network inspect bridge                    -> 172.17.0.0/16
# Сверка нужна была потому, что переименование compose-проекта пересоздаёт
# сеть, а подсеть в docker-compose.yml мониторинга явно не задана — docker
# берёт её из пула. Вопрос был оставлен открытым в fc1b132 и закрывается здесь.
# При следующем переименовании стека или правке сетей мониторинга перепроверить
# заново: молча разойдётся не конфиг, а сбор метрик.
#
# Второй половиной этой связки служит METRICS_ADDR в /etc/snakes/snakes.env:
# игра продолжает слушать 127.0.0.1, а на адресе моста поднимается отдельный
# слушатель, отдающий ровно /metrics. Разрешить подсеть и оставить всё на
# игровом порту значило бы открыть контейнерам заодно /ws и статику в обход
# nginx со всеми его лимитами и заголовками.
[Service]
IPAddressAllow=172.17.0.0/16
IPAddressAllow=172.18.0.0/16

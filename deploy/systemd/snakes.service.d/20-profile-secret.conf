# Не давать серверу подняться с эфемерным ключом подписи профилей.
#
# PROFILE_SECRET — HMAC-ключ, которым подписываются токены личности игрока.
# По токену сервер узнаёт, что это тот же человек, что и вчера, и отдаёт ему
# баланс «Стиля», купленную косметику, ачивки и титулы.
#
# Если переменная пуста, InitSecret (internal/profiles/profiles.go) генерирует
# случайный ключ при каждом старте. Дальше по шагам:
#   1. все токены, выданные до рестарта, перестают проходить проверку;
#   2. каждый игрок молча получает НОВЫЙ profile id — с нулевым балансом и
#      пустым инвентарём;
#   3. настоящие профили остаются в profiles.json мёртвым грузом и вычищаются
#      по TTL через 90 дней;
#   4. процесс при этом стартует нормально, /healthz и /readyz зелёные,
#      выкатка проходит успешно.
#
# То есть единственный признак того, что всем игрокам обнулили прогресс, —
# одна строка в логе:
#   PROFILE_SECRET is not set: generated an ephemeral secret
#
# Этот дроп-ин превращает тихую потерю в громкий отказ: с ним сервер откажется
# стартовать, и упадёт ВЫКАТКА, а не прогресс игроков. Ровно то поведение,
# которое docs/config.md предписывает для прода («В проде 1»), — до сих пор
# предписание жило только в тексте и ничем не проверялось.
#
# ВАЖНО перед изменением. Включать это можно только тогда, когда PROFILE_SECRET
# действительно задан в /etc/snakes/snakes.env. Проверка (возвращает 1, если
# переменная есть и непустая):
#
#     sudo grep -c '^PROFILE_SECRET=.' /etc/snakes/snakes.env
#
# На момент добавления файла проверено владельцем сервера: секрет задан.
# Если когда-нибудь понадобится поднять сервер БЕЗ секрета (отладка на чистой
# машине), не правьте этот файл — задайте PROFILE_SECRET, иначе следующая
# выкатка снова упрётся в тот же отказ.

[Service]
Environment=PROFILE_SECRET_REQUIRED=1

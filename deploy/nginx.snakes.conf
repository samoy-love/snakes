# snakes.samoy.love — system nginx (Ubuntu 24.04, nginx 1.24.0) reverse proxy.
#
# Installed as /etc/nginx/sites-available/snakes.conf with a symlink from
# sites-enabled/. This file describes ONLY the `snakes.samoy.love` server_name.
# Never merge another domain into the server_name lines here: the neighbouring
# projects (launcher.samoy.love, metro.samoy.love) own their own config files
# and must not be touched by a Snakes deploy.
#
# The application is a Go binary managed by systemd (snakes.service). It listens
# on 127.0.0.1:8090 only — ports 3000/3001 on this host are already taken by an
# openspeedtest container — and nginx is the only thing that talks to it.
#
# The certificate is issued with the webroot plugin (not --nginx), so certbot
# never rewrites this file or any neighbouring config:
#   sudo certbot certonly --webroot -w /var/www/snakes-acme -d snakes.samoy.love

upstream snakes_app {
    server 127.0.0.1:8090;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# HTTP: ACME challenges are served directly, everything else is redirected.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name snakes.samoy.love;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/snakes-acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name snakes.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/snakes.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snakes.samoy.love/privkey.pem;

    access_log /var/log/nginx/snakes_access.log;
    error_log  /var/log/nginx/snakes_error.log;

    # Control frames only; nothing is uploaded.
    client_max_body_size 1m;

    # HSTS is the one security header the app does not emit itself.
    # securityHeadersMiddleware in server.go already sets X-Content-Type-Options,
    # X-Frame-Options, Referrer-Policy, COOP, CORP, Permissions-Policy and CSP on
    # every response, so those are deliberately NOT repeated here — `add_header`
    # appends rather than replaces and would send each of them twice.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # -----------------------------------------------------------------------
    # WebSocket. Must come before the catch-all `location /`.
    # -----------------------------------------------------------------------
    location = /ws {
        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Game sessions are long-lived and idle between ticks.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Never buffer or cache a socket.
        proxy_buffering off;
        proxy_cache off;
    }

    # -----------------------------------------------------------------------
    # Operational endpoints
    # -----------------------------------------------------------------------

    # /metrics is unauthenticated upstream, so it stays internal.
    location = /metrics {
        deny all;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Static assets.
    #
    # The Go app already emits Cache-Control for these paths. `add_header` would
    # append a second value rather than replace it, so hide the upstream header
    # first and set exactly one authoritative value here.
    # -----------------------------------------------------------------------

    # Emoji sprites are immutable content.
    location ^~ /emoji-64/ {
        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML/JS/CSS are unversioned, so they must never be cached: a stale
    # client.js against a new protocol version breaks the game silently.
    location ~* \.(?:html|js|css)$ {
        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma  "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # -----------------------------------------------------------------------
    # Everything else, including "/".
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

# ---------------------------------------------------------------------------
# nginx для ЛОКАЛЬНОГО docker compose (монтируется в /etc/nginx/conf.d/default.conf).
#
# Только HTTP: TLS-сертификатов на машине разработчика нет, и раньше именно
# из-за жёсткой ссылки на /etc/letsencrypt/live/... контейнер nginx падал при
# старте с "cannot load certificate". Прод-конфиг с TLS лежит рядом:
# deploy/nginx.prod.conf, он подключается через docker-compose.prod.yml.
#
# Маршруты игры вынесены в deploy/nginx.common.conf — общий файл для обоих
# конфигов.
# ---------------------------------------------------------------------------

# ${GAME_PORT} — единственная подстановка в этом файле. Он монтируется не в
# conf.d/, а в /etc/nginx/templates/default.conf.template: официальный образ
# nginx прогоняет templates через envsubst при старте. NGINX_ENVSUBST_FILTER в
# docker-compose.yml ограничивает подстановку ровно этой переменной, иначе
# envsubst съел бы $binary_remote_addr, $scheme и все остальные переменные
# самого nginx. Раньше порт был прибит к 3000 и при PORT=4000 nginx проксировал
# в никуда.
upstream snakes_game {
    server game:${GAME_PORT};
    keepalive 16;
}

# --------------------------- Лимиты: зоны (http) ---------------------------
# Зоны обязаны жить в контексте http. Имена с префиксом snakes_, чтобы не
# столкнуться с чужими зонами, если этот http-блок когда-нибудь окажется общим.
# Сами limit_conn/limit_req стоят в nginx.common.conf.
limit_conn_zone $binary_remote_addr zone=snakes_ws_conn:10m;
limit_req_zone  $binary_remote_addr zone=snakes_ws_req:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=snakes_http_conn:10m;
limit_req_zone  $binary_remote_addr zone=snakes_http_req:10m rate=20r/s;

# ---------------------------------------------------------------------------
# V1: кэширование версионированной статики.
#
# index.html ссылается на собственную статику как /client.js?v=__BUILD__;
# scripts/deploy.sh подменяет литерал на идентификатор релиза в копии, которая
# уезжает на сервер. Непустой v, отличный от литерала, значит «этот URL меняется
# на каждом релизе» — такой ответ можно кэшировать навсегда. Всё остальное
# (голый /client.js, пустой ?v=, незаштампованный __BUILD__ при `go run .`)
# остаётся некэшируемым, иначе игрок залипнет на старом бандле.
#
# То же правило продублировано в server.go (isVersionedAsset): nginx отдаёт
# js/css с диска сам, и заголовок Go-приложения сюда не долетает, но конфиги
# обязаны совпадать — иначе поведение зависит от того, кто отдал файл.
#
# Пустое значение add_header nginx не добавляет вовсе, поэтому Pragma/Expires
# исчезают ровно на версионированных ответах.
# ---------------------------------------------------------------------------
map $arg_v $snakes_asset_cc {
    default     "public, max-age=31536000, immutable";
    ""          "no-store, no-cache, must-revalidate";
    "__BUILD__" "no-store, no-cache, must-revalidate";
}
map $arg_v $snakes_asset_pragma {
    default     "";
    ""          "no-cache";
    "__BUILD__" "no-cache";
}
map $arg_v $snakes_asset_expires {
    default     "";
    ""          "0";
    "__BUILD__" "0";
}

# HSTS имеет смысл только поверх TLS; по HTTP значение пустое и nginx
# заголовок не добавляет.
map $scheme $hsts_value {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/snakes_access.log;
    error_log  /var/log/nginx/snakes_error.log;

    # 429 честнее дефолтного 503: 503 читается людьми и мониторингом как
    # «сервер сломался».
    limit_conn_status 429;
    limit_req_status  429;
    limit_req_log_level warn;

    root /var/www/snakes;
    index index.html;

    include /etc/nginx/snippets/nginx.common.conf;
}

# ------------------- Внутренний слушатель метрик (не публикуется) ----------
# Доступен только по имени nginx:8081 из docker-сети snakes_net.
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /metrics {
        proxy_pass http://snakes_game;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}

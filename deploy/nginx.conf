# ---------------------------------------------------------------------------
# nginx для ЛОКАЛЬНОГО docker compose (монтируется в /etc/nginx/conf.d/default.conf).
#
# Только HTTP: TLS-сертификатов на машине разработчика нет, и раньше именно
# из-за жёсткой ссылки на /etc/letsencrypt/live/... контейнер nginx падал при
# старте с "cannot load certificate". Прод-конфиг с TLS лежит рядом:
# deploy/nginx.prod.conf, он подключается через docker-compose.prod.yml.
#
# Маршруты игры вынесены в deploy/nginx.common.conf — общий файл для обоих
# конфигов.
# ---------------------------------------------------------------------------

upstream snakes_game {
    server game:3000;
    keepalive 16;
}

# --------------------------- Лимиты: зоны (http) ---------------------------
# Зоны обязаны жить в контексте http. Имена с префиксом snakes_, чтобы не
# столкнуться с чужими зонами, если этот http-блок когда-нибудь окажется общим.
# Сами limit_conn/limit_req стоят в nginx.common.conf.
limit_conn_zone $binary_remote_addr zone=snakes_ws_conn:10m;
limit_req_zone  $binary_remote_addr zone=snakes_ws_req:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=snakes_http_conn:10m;
limit_req_zone  $binary_remote_addr zone=snakes_http_req:10m rate=20r/s;

# HSTS имеет смысл только поверх TLS; по HTTP значение пустое и nginx
# заголовок не добавляет.
map $scheme $hsts_value {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/snakes_access.log;
    error_log  /var/log/nginx/snakes_error.log;

    # 429 честнее дефолтного 503: 503 читается людьми и мониторингом как
    # «сервер сломался».
    limit_conn_status 429;
    limit_req_status  429;
    limit_req_log_level warn;

    root /var/www/snakes;
    index index.html;

    include /etc/nginx/snippets/nginx.common.conf;
}

# ------------------- Внутренний слушатель метрик (не публикуется) ----------
# Доступен только по имени nginx:8081 из docker-сети snakes_net.
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /metrics {
        proxy_pass http://snakes_game;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}

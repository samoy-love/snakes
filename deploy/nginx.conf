# ---------------------------------------------------------------------------
# nginx для docker compose (монтируется в /etc/nginx/conf.d/default.conf).
#
# За основу взят прод-блок snakes.samoy.love из launcher.conf в корне репозитория.
# Отличия от прода:
#   * upstream — контейнер game:3000 вместо 127.0.0.1:3000;
#   * /metrics закрыт снаружи (доступ только из внутренней docker-сети);
#   * добавлен полный набор заголовков безопасности;
#   * статика читается из /var/www/snakes (bind-mount ./public).
#
# Если TLS-сертификатов нет, закомментируйте 443-й server-блок и замените
# `return 301` в 80-м на содержимое 443-го — тогда игра поедет по HTTP.
# ---------------------------------------------------------------------------

upstream snakes_game {
    server game:3000;
    keepalive 16;
}

# Внутренние сети docker: только из них разрешён доступ к /metrics.
geo $metrics_allowed {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    127.0.0.0/8    1;
}

# ------------------------------ HTTP: редирект -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME-челленджи letsencrypt должны отдаваться по HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------ HTTPS: игра --------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name snakes.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/snakes.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snakes.samoy.love/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/snakes_access.log;
    error_log  /var/log/nginx/snakes_error.log;

    client_max_body_size 2m;

    root /var/www/snakes;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # ---------------------------- WebSocket ----------------------------
    location = /ws {
        proxy_pass http://snakes_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }

    # ------------------- /metrics: только изнутри сети ------------------
    location = /metrics {
        if ($metrics_allowed = 0) {
            return 404;
        }
        proxy_pass http://snakes_game;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------- Статика ------------------------------
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Эмодзи-спрайты неизменяемы: агрессивный кэш.
    location ^~ /emoji-64/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # html/js/css обновляются вместе с релизом — кэш запрещён.
    location = / {
        try_files /index.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma  "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* \.(?:html|css|js|mjs)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma  "no-cache" always;
        add_header Expires "0" always;
    }

    # Всё остальное: сначала файл на диске, иначе — в Go-сервер.
    location / {
        try_files $uri $uri/ @game;
    }

    location @game {
        proxy_pass http://snakes_game;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

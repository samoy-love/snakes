# Заголовки безопасности. Выделены в отдельный сниппет потому, что в nginx
# любой add_header внутри location ПОЛНОСТЬЮ отменяет add_header, унаследованные
# от server — поэтому набор приходится включать в каждый location явно.
#
# $hsts_value задаётся через map в nginx.conf: по HTTP он пустой, и nginx
# пропускает add_header с пустым значением. Так один и тот же сниппет годится
# и для локального HTTP-стенда, и для прод-блока с TLS.
add_header X-Content-Type-Options       "nosniff" always;
add_header X-Frame-Options              "DENY" always;
add_header Referrer-Policy              "no-referrer" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security    $hsts_value always;

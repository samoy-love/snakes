name: snakes

# Локальный стенд: игра + nginx по HTTP на ${HTTP_PORT} (по умолчанию 8080).
# Прод с TLS: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: snakes:local
    restart: unless-stopped
    # Драйвер json-file по умолчанию НЕ ограничен: файл в
    # /var/lib/docker/containers/<id>/*-json.log растёт до заполнения диска, а
    # диск здесь общий с чужими проектами. 10m x 3 = максимум 30 МБ на сервис.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      # .env необязателен: без него берутся дефолты ниже. Но PROFILE_SECRET
      # задать придётся (см. комментарий у переменной).
      - path: .env
        required: false
    environment:
      # Явный проброс: значения берутся из .env, дефолты — как в коде.
      PORT: ${PORT:-3000}
      ROOM_LIMIT: ${ROOM_LIMIT:-16}
      MATCH_DURATION_TICKS: ${MATCH_DURATION_TICKS:-3000}
      MATCH_INTERMISSION_TICKS: ${MATCH_INTERMISSION_TICKS:-150}
      # Origin'ы, с которых разрешено WebSocket-рукопожатие. Без переменной
      # сервер уходит в дефолт https://snakes.samoy.love и отвечает 403 на /ws
      # с любого другого хоста (localhost/127.0.0.1 разрешены в коде отдельно).
      # Если открываете стенд не по localhost — перечислите здесь свой origin
      # ВМЕСТЕ С ПОРТОМ, например http://192.168.1.10:8080
      WS_ORIGINS: ${WS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # Дефолт в КОДЕ — «пропускать loopback-origin мимо WS_ORIGINS», то есть
      # allowlist перестаёт что-либо значить для страниц, поднятых на машине
      # самого игрока. Здесь он выключен, потому что этот же базовый файл
      # используется прод-оверлеем docker-compose.prod.yml. Локальный стенд от
      # этого не ломается: http://localhost:8080 и http://127.0.0.1:8080 и так
      # перечислены в WS_ORIGINS выше.
      WS_ALLOW_LOCALHOST: ${WS_ALLOW_LOCALHOST:-0}
      # Потолки. Значения совпадают с дефолтами в коде, вынесены явно, чтобы их
      # было видно и можно было поднять/опустить через .env.
      MAX_ROOMS: ${MAX_ROOMS:-64}
      MAX_PROFILES: ${MAX_PROFILES:-50000}
      PROFILE_EMPTY_TTL_HOURS: ${PROFILE_EMPTY_TTL_HOURS:-6}
      # Без секрета прогресс игроков не переживает рестарт (см. .env.example).
      PROFILE_SECRET: ${PROFILE_SECRET:?PROFILE_SECRET must be set in .env - otherwise all player progress is lost on every restart}
      PROFILES_PATH: ${PROFILES_PATH:-/app/data/profiles.json}
      # Подсеть docker-сети обязана быть в списке, иначе X-Forwarded-For от
      # nginx не принимается и rate-limit считает всех игроков одним клиентом.
      #
      # Список НАМЕРЕННО узкий — только сеть snakes_net (её subnet закреплён
      # ниже) плюс loopback. Раньше здесь стояли все диапазоны RFC1918
      # (10/8, 172.16/12, 192.168/16). requestClientIP() в ws.go идёт по цепочке
      # X-Forwarded-For справа налево и пропускает всё, что считается доверенным
      # прокси; при широком списке IP игрока из локальной сети (192.168.x.x)
      # тоже попадал в «доверенные», цепочка исчерпывалась и функция возвращала
      # адрес самого nginx. В логах это видно как ip="172.18.0.3" для всех
      # подключений, а rate-limit складывал всех игроков LAN в одну корзину.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/8,::1,172.28.0.0/16}
      BOT_DEATH_SNAP: ${BOT_DEATH_SNAP:-}
    volumes:
      - snakes_data:/app/data
    # Порт наружу НЕ публикуется: доступ только через nginx по внутренней сети.
    expose:
      - "${PORT:-3000}"
    # Порт БЕРЁТСЯ ИЗ ${PORT}. Раньше он был прибит к 3000: при PORT=4000
    # контейнер навсегда оставался unhealthy, а nginx с
    # `depends_on: service_healthy` вообще не стартовал.
    # Форма CMD-SHELL нужна, чтобы ${PORT} раскрыл шелл внутри контейнера
    # (в форме CMD подстановки не происходит).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${PORT:-3000}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - snakes_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      game:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      # Порт апстрима больше не прибит гвоздями в nginx.conf: официальный образ
      # прогоняет /etc/nginx/templates/*.template через envsubst при старте.
      # NGINX_ENVSUBST_FILTER ограничивает подстановку одной переменной —
      # иначе envsubst затёр бы $binary_remote_addr, $scheme, $host и прочие
      # переменные самого nginx пустыми строками.
      GAME_PORT: ${PORT:-3000}
      NGINX_ENVSUBST_FILTER: '^GAME_PORT$$'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx.common.conf:/etc/nginx/snippets/nginx.common.conf:ro
      - ./deploy/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # Статика раздаётся напрямую nginx-ом, минуя Go-процесс.
      # Тот же каталог лежит и внутри образа game (сервер умеет отдавать его сам).
      - ./public:/var/www/snakes:ro
    # Проверяем именно проксирование: /healthz идёт через nginx в game.
    # wget есть в busybox образа nginx:alpine, ставить ничего не нужно.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - snakes_net

networks:
  snakes_net:
    driver: bridge
    # Subnet закреплён явно, чтобы TRUSTED_PROXIES можно было сузить до одной
    # сети вместо всех диапазонов RFC1918. Если 172.28.0.0/16 занят другой
    # сетью на машине, поменяйте здесь и в TRUSTED_PROXIES одновременно.
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  snakes_data:

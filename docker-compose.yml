name: snakes

services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: snakes:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Явный проброс: значения берутся из .env, дефолты — как в коде.
      PORT: ${PORT:-3000}
      ROOM_LIMIT: ${ROOM_LIMIT:-16}
      MATCH_DURATION_TICKS: ${MATCH_DURATION_TICKS:-3000}
      MATCH_INTERMISSION_TICKS: ${MATCH_INTERMISSION_TICKS:-300}
      PROFILE_SECRET: ${PROFILE_SECRET:?PROFILE_SECRET must be set in .env - otherwise all player progress is lost on every restart}
      PROFILES_PATH: ${PROFILES_PATH:-/app/data/profiles.json}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/8,::1,172.16.0.0/12}
      BOT_DEATH_SNAP: ${BOT_DEATH_SNAP:-}
    volumes:
      - snakes_data:/app/data
    # Порт наружу НЕ публикуется: доступ только через nginx по внутренней сети.
    expose:
      - "3000"
    networks:
      - snakes_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # Статика раздаётся напрямую nginx-ом, минуя Go-процесс.
      # Тот же каталог лежит и внутри образа game (сервер умеет отдавать его сам).
      - ./public:/var/www/snakes:ro
      # TLS-сертификаты хоста (letsencrypt). Если TLS не нужен — закомментируйте
      # и оставьте в nginx.conf только 80-й server-блок.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - snakes_net

networks:
  snakes_net:
    driver: bridge

volumes:
  snakes_data:
